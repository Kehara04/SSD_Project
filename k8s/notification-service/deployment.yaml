apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: medichannel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: kswijesinghe/notification-service:latest
          ports:
            - containerPort: 5007
          env:
            - name: PORT
              value: "5007"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: NOTIFICATION_MONGO_URI
            - name: APPOINTMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: APPOINTMENT_SERVICE_URL
            - name: TELEMEDICINE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: TELEMEDICINE_SERVICE_URL
            - name: SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SERVICE_SECRET
            - name: EMAIL_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: EMAIL_SERVICE
            - name: EMAIL_FROM_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: EMAIL_FROM_NAME
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_FROM
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PASS
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SMTP_SECURE
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMTP_PASS
            - name: TEXTLK_API_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: TEXTLK_API_URL
            - name: TEXTLK_SENDER_ID
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: TEXTLK_SENDER_ID
            - name: TEXTLK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: TEXTLK_API_TOKEN