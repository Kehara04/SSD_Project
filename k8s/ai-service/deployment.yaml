apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: medichannel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: kswijesinghe/ai-service:latest
          ports:
            - containerPort: 5008
          env:
            - name: PORT
              value: "5008"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GEMINI_API_KEY
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: AUTH_SERVICE_URL