apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medichannel-ingress
  namespace: medichannel
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          - path: /api/patient
            pathType: Prefix
            backend:
              service:
                name: patient-service
                port:
                  number: 5002

          - path: /api/doctor
            pathType: Prefix
            backend:
              service:
                name: doctor-service
                port:
                  number: 5000

          - path: /api/appointment
            pathType: Prefix
            backend:
              service:
                name: appointment-service
                port:
                  number: 5003

          - path: /api/telemedicine
            pathType: Prefix
            backend:
              service:
                name: telemedicine-service
                port:
                  number: 5004

          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 5005

          - path: /api/prescription
            pathType: Prefix
            backend:
              service:
                name: prescription-service
                port:
                  number: 5006

          - path: /api/notification
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 5007

          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 5008